<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사진 만화경</title>
<style>
  :root { --fg:#fff; --bg:#000; --panel:rgba(20,20,24,.72); --accent:#ffcc55; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow:hidden; overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }
  .start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; background:radial-gradient(circle at 50% 40%, #2a1f3d, #000 70%); z-index:5; }
  .start h1 { margin:0 0 4px; font-size:28px; letter-spacing:.02em; }
  .start p { margin:0 0 10px; opacity:.75; font-size:15px; line-height:1.5; }
  .btn { appearance:none; border:0; border-radius:999px; padding:14px 22px; font-size:16px; font-weight:600;
    background:var(--accent); color:#111; min-width:220px; cursor:pointer; }
  .btn.ghost { background:rgba(255,255,255,.12); color:#fff; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:4; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:flex; flex-direction:column; gap:8px; transition:transform .25s; }
  .bar.hidden { transform:translateY(110%); }
  .row { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .row label { font-size:13px; opacity:.85; white-space:nowrap; min-width:58px; }
  .row input[type=range] { flex:1; accent-color:var(--accent); }
  .row .val { font-size:13px; width:28px; text-align:right; opacity:.85; }
  .icons { display:flex; gap:6px; justify-content:space-between; }
  .ib { flex:1; appearance:none; border:0; border-radius:12px; padding:9px 4px; background:rgba(255,255,255,.1);
    color:#fff; font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  .ib span { font-size:18px; line-height:1; }
  .ib.on { background:var(--accent); color:#111; }
  .toggle { position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:4; width:40px; height:40px;
    border-radius:50%; border:0; background:var(--panel); color:#fff; font-size:18px; cursor:pointer; }
  .toast { position:fixed; left:50%; top:calc(20px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:6;
    background:var(--panel); padding:8px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  label.btn, label.ib { display:flex; justify-content:center; text-align:center; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="start" id="start">
  <h1>사진 만화경</h1>
  <p>사진을 찍거나 앨범에서 골라<br>만화경으로 보세요.</p>
  <label class="btn" id="btnCam" for="fCam">📷 사진 찍기</label>
  <label class="btn ghost" id="btnAlbum" for="fAlbum">🖼️ 앨범에서 고르기</label>
  <button class="btn ghost" id="btnDemo">✨ 샘플로 보기</button>
</div>

<button class="toggle" id="toggle" hidden aria-label="메뉴 숨기기">☰</button>

<div class="bar hidden" id="bar">
  <div class="row"><label>조각 수</label><input id="seg" type="range" min="3" max="16" step="1" value="8"><span class="val" id="segV">8</span></div>
  <div class="row"><label>확대</label><input id="zoom" type="range" min="0.3" max="3" step="0.01" value="1"><span class="val" id="zoomV">1.0</span></div>
  <div class="icons">
    <label class="ib" id="bCam" for="fCam"><span>📷</span>촬영</label>
    <label class="ib" id="bAlbum" for="fAlbum"><span>🖼️</span>앨범</label>
    <button class="ib" id="bTilt"><span>📱</span>기울기</button>
    <button class="ib" id="bAuto"><span>🔄</span>자동회전</button>
    <button class="ib" id="bSave"><span>💾</span>저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fCam" accept="image/*" capture="environment">
<input type="file" id="fAlbum" accept="image/*">

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  let img = null, pattern = null;               // source image (canvas, downscaled)
  let segments = 8;
  let zoom = 1;
  let rot = 0;                  // rotation of image inside wedge (rad)
  let offX = 0, offY = 0;       // image offset (px in source space)
  let spin = 0;                 // whole-kaleidoscope rotation
  let auto = false;
  let tiltOn = false;
  let tiltRot = 0, tiltX = 0, tiltY = 0;
  let dirty = true;
  let W = 0, H = 0, DPR = 1;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    dirty = true;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- image loading ----------
  function useImageSource(src, w, h) {
    const MAX = 1200;
    const s = Math.min(1, MAX / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    // 상하좌우로 거울 반복되는 타일을 만들어 어느 방향으로 끌어도 빈 곳이 없게 함
    const t = document.createElement('canvas');
    t.width = c.width * 2; t.height = c.height * 2;
    const tg = t.getContext('2d');
    for (let i = 0; i < 4; i++) {
      tg.save();
      tg.translate((i & 1) ? t.width : 0, (i & 2) ? t.height : 0);
      tg.scale((i & 1) ? -1 : 1, (i & 2) ? -1 : 1);
      tg.drawImage(c, 0, 0);
      tg.restore();
    }
    pattern = ctx.createPattern(t, 'repeat');
    img = c; rot = 0; offX = 0; offY = 0; spin = 0; dirty = true;
    $('start').style.display = 'none';
    $('bar').classList.remove('hidden');
    $('toggle').hidden = false;
  }

  async function loadFile(file) {
    if (!file) return;
    try {
      if ('createImageBitmap' in window) {
        const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
        useImageSource(bmp, bmp.width, bmp.height);
        return;
      }
    } catch (e) { /* fall back below */ }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { useImageSource(im, im.naturalWidth, im.naturalHeight); URL.revokeObjectURL(url); };
    im.onerror = () => toast('사진을 불러오지 못했습니다');
    im.src = url;
  }

  function demoImage() {
    const c = document.createElement('canvas'); c.width = 800; c.height = 800;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 800, 800);
    bg.addColorStop(0, '#1b0a3a'); bg.addColorStop(1, '#0a3a3a');
    g.fillStyle = bg; g.fillRect(0, 0, 800, 800);
    const cols = ['#ff5e7e', '#ffcc55', '#55e0ff', '#a77bff', '#6dff9c', '#ff8f3d'];
    for (let i = 0; i < 70; i++) {
      g.globalAlpha = 0.55 + Math.random() * 0.45;
      g.fillStyle = cols[i % cols.length];
      const x = Math.random() * 800, y = Math.random() * 800, r = 15 + Math.random() * 70;
      g.beginPath();
      if (i % 3 === 0) { g.arc(x, y, r, 0, Math.PI * 2); }
      else if (i % 3 === 1) { g.moveTo(x, y - r); g.lineTo(x + r, y + r); g.lineTo(x - r, y + r); g.closePath(); }
      else { g.rect(x - r / 2, y - r / 2, r, r * 0.6); }
      g.fill();
    }
    return c;
  }

  $('btnDemo').onclick = () => { const d = demoImage(); useImageSource(d, d.width, d.height); };
  $('fCam').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('fAlbum').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

  // ---------- controls ----------
  $('seg').oninput = e => { segments = +e.target.value; $('segV').textContent = segments; dirty = true; };
  $('zoom').oninput = e => { zoom = +e.target.value; $('zoomV').textContent = zoom.toFixed(1); dirty = true; };
  $('bAuto').onclick = () => { auto = !auto; $('bAuto').classList.toggle('on', auto); };
  $('toggle').onclick = () => $('bar').classList.toggle('hidden');

  $('bSave').onclick = () => {
    draw();
    cv.toBlob(blob => {
      if (!blob) { toast('저장에 실패했습니다'); return; }
      const name = 'kaleidoscope-' + Date.now() + '.png';
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '사진 만화경' }).catch(() => {});
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast('이미지를 저장했습니다');
      }
    }, 'image/png');
  };

  // ---------- tilt ----------
  function onOrient(e) {
    if (e.gamma == null) return;
    tiltRot = (e.gamma || 0) * Math.PI / 180 * 1.2;          // 좌우 기울기 → 회전
    tiltY = Math.max(-60, Math.min(60, (e.beta || 0) - 45)) * 4; // 앞뒤 기울기 → 이동
    tiltX = (e.gamma || 0) * 3;
    dirty = true;
  }
  $('bTilt').onclick = async () => {
    if (tiltOn) {
      tiltOn = false; window.removeEventListener('deviceorientation', onOrient);
      tiltRot = tiltX = tiltY = 0; dirty = true;
      $('bTilt').classList.remove('on'); return;
    }
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();   // iOS 13+
        if (r !== 'granted') { toast('기울기 권한이 거부되었습니다'); return; }
      }
      if (typeof DeviceOrientationEvent === 'undefined') { toast('이 기기는 기울기를 지원하지 않습니다'); return; }
      window.addEventListener('deviceorientation', onOrient);
      tiltOn = true; $('bTilt').classList.add('on');
      toast('폰을 기울여 보세요');
    } catch (err) { toast('기울기를 켤 수 없습니다 (HTTPS 필요)'); }
  };

  // ---------- touch: 1 finger rotate, 2 fingers pinch zoom + rotate ----------
  const pts = new Map();
  let last = null;
  function center() { return { x: W / 2, y: H / 2 }; }
  function snapshot() {
    const arr = [...pts.values()];
    if (arr.length === 1) {
      const c = center();
      return { n: 1, ang: Math.atan2(arr[0].y - c.y, arr[0].x - c.x), x: arr[0].x, y: arr[0].y };
    }
    if (arr.length >= 2) {
      const [a, b] = arr;
      return { n: 2, ang: Math.atan2(b.y - a.y, b.x - a.x), dist: Math.hypot(b.x - a.x, b.y - a.y),
               x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    return null;
  }
  function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = snapshot(); });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const s = snapshot();
    if (!s || !last || s.n !== last.n) { last = s; return; }
    if (s.n === 1) {
      rot += angDiff(s.ang, last.ang);           // 원을 그리듯 돌리면 회전
      offX += (s.x - last.x) * 0.6 / zoom;       // 끌면 사진 위치 이동
      offY += (s.y - last.y) * 0.6 / zoom;
    } else {
      rot += angDiff(s.ang, last.ang);
      zoom = Math.max(0.3, Math.min(3, zoom * s.dist / (last.dist || s.dist)));
      $('zoom').value = zoom; $('zoomV').textContent = zoom.toFixed(1);
    }
    last = s; dirty = true;
  });
  const up = e => { pts.delete(e.pointerId); last = snapshot(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    $('zoom').value = zoom; $('zoomV').textContent = zoom.toFixed(1); dirty = true;
  }, { passive: false });

  // ---------- render ----------
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (!img) return;
    const cw = cv.width, ch = cv.height;
    const R = Math.hypot(cw, ch) / 2 + 2;
    const n = segments * 2;                  // 거울 대칭 쌍으로 그리기
    const a = Math.PI * 2 / n;
    const scale = zoom * Math.max(R / img.width, R / img.height) * 1.1;
    const ox = (offX + tiltX) * DPR, oy = (offY + tiltY) * DPR;

    for (let i = 0; i < n; i++) {
      ctx.setTransform(1, 0, 0, 1, cw / 2, ch / 2);
      ctx.rotate(spin);
      if (i % 2 === 0) { ctx.rotate(i * a); }
      else { ctx.rotate((i + 1) * a); ctx.scale(1, -1); }
      // 쐐기 모양을 바깥으로 1.5px 넓혀 이음매 선이 보이지 않게 함
      const e = 1.5 * DPR, L = R * 2.2;
      const ca = Math.cos(a), sa = Math.sin(a), nx = -sa * e, ny = ca * e;
      ctx.beginPath();
      ctx.moveTo(-e, -e);
      ctx.lineTo(L, -e);
      ctx.lineTo(L * ca + nx, L * sa + ny);
      ctx.lineTo(nx - ca * e, ny - sa * e);
      ctx.closePath();
      ctx.save();
      ctx.clip();
      ctx.rotate(rot + tiltRot);
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);
      ctx.translate(-img.width / 2, -img.height / 2);
      const K = (L + Math.abs(ox) + Math.abs(oy)) / scale + img.width + img.height;
      ctx.fillStyle = pattern;
      ctx.fillRect(-K, -K, 2 * K, 2 * K);
      ctx.restore();
    }
  }

  let prev = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
    if (auto) { spin += dt * 0.35; rot -= dt * 0.15; dirty = true; }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 페이지에 바로 사진을 끌어다 놓아도 열리도록 (PC용)
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
})();
</script>
</body>
</html>
